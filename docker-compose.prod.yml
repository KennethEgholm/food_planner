services:
  postgres:
    image: postgres:15-alpine
    container_name: food_planner_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
        - pgdata:/var/lib/postgresql/data
        # Note: Init sql only runs on empty DB
        - ./server/database.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: 
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: food_planner_server
    ports:
      - "${SERVER_PORT}:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - VITE_API_URL=${VITE_API_URL} 
      # Note: We need to ensure CORS settings are correct for the domain
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  client:
    build: 
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: food_planner_client
    ports:
      - "${CLIENT_PORT}:80"
    environment:
      # These must be available at BUILD time for Vite
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
