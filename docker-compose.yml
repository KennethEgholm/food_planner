services:
  postgres:
    image: postgres:15-alpine
    container_name: food_planner_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
        - pgdata:/var/lib/postgresql/data
        - ./server/database.sql:/docker-entrypoint-initdb.d/init.sql

  server:
    build: ./server
    container_name: food_planner_server
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      - PORT=${SERVER_PORT}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      - postgres
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    container_name: food_planner_client
    ports:
      - "${CLIENT_PORT}:5173"
    environment:
      - VITE_API_URL=http://localhost:${SERVER_PORT}
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  pgdata:
